name: KaliSpot
description: >-
  KaliSpot is a fintech network operated by Outsource Monetic Group Inc. (OMG), an
  Atlanta-headquartered startup with legal presence in Senegal and Morocco. KaliSpots are
  Financial Inclusive Service Points (FISP) — ATM and interactive teller machine (ITM)
  locations running a brand-agnostic, "phygital" infrastructure that bridges physical cash
  and digital financial services. From a single access point, customers reach banks, mobile
  money operators, and fintechs for 24/7 cash-in/cash-out (CICO), positioning KaliSpot as an
  independent omnichannel ATM operator across Francophone West and Central Africa, with pilots
  launched in Senegal and Côte d'Ivoire. Founded 2021; pre-seed funding from 500 Global and
  Grenfell Holdings. No public developer API or documentation surface has been published to date.
